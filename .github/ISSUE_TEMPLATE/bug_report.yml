name: Bug Report
description: Something is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please fill in **all required fields** — reports missing environment details will be closed without investigation.

  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: mc_version
    attributes:
      label: Minecraft version
      placeholder: "e.g. 1.21.11"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Jump Delay Fix version
      placeholder: "e.g. 1.1.0"
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Loader version
      description: Fabric Loader or NeoForge version.
      placeholder: "e.g. 0.18.4 / 21.1.174"
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: Java version
      placeholder: "e.g. 21.0.6"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join server X / open singleplayer world
        2. Press jump key
        3. ...
    validations:
      required: true

  - type: dropdown
    id: other_mods
    attributes:
      label: Does the bug occur with only Jump Delay Fix installed?
      options:
        - "Yes"
        - "No — I have other mods installed"
        - "Not tested"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: |
        Paste the relevant portion of `latest.log` or the crash report.
        Use a gist or pastebin for long outputs.
      render: text
    validations:
      required: false
