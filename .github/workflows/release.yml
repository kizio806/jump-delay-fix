name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Java version
        id: jvm
        run: |
          JVM_VER=$(grep '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=${JVM_VER:-21}" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.0.0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.jvm.outputs.version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.0.0

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Read build metadata
        id: metadata
        run: |
          MOD_ID=$(grep '^mod_id=' gradle.properties | cut -d'=' -f2)
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          FABRIC_VERSIONS=$(grep '^fabric_game_versions=' gradle.properties | cut -d'=' -f2- || true)
          NEOFORGE_VERSIONS=$(grep '^neoforge_game_versions=' gradle.properties | cut -d'=' -f2- || true)
          MODRINTH_VERSIONS=$(grep '^modrinth_game_versions=' gradle.properties | cut -d'=' -f2- || true)

          [ -z "$FABRIC_VERSIONS" ] && FABRIC_VERSIONS="$MODRINTH_VERSIONS"
          [ -z "$NEOFORGE_VERSIONS" ] && NEOFORGE_VERSIONS="$MODRINTH_VERSIONS"
          [ -z "$MODRINTH_VERSIONS" ] && MODRINTH_VERSIONS="$MC_VERSION"

          JAVA_VERSION=$(grep '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')

          {
            echo "mod_id=$MOD_ID"
            echo "mod_version=$MOD_VERSION"
            echo "minecraft_version=$MC_VERSION"
            echo "fabric_game_versions=$FABRIC_VERSIONS"
            echo "neoforge_game_versions=$NEOFORGE_VERSIONS"
            echo "modrinth_game_versions=$MODRINTH_VERSIONS"
            echo "java_version=${JAVA_VERSION:-21}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute artifact names
        id: artifacts
        run: |
          MOD_ID="${{ steps.metadata.outputs.mod_id }}"
          MOD_VERSION="${{ steps.metadata.outputs.mod_version }}"
          MC_VERSION="${{ steps.metadata.outputs.minecraft_version }}"
          echo "fabric_jar=fabric/build/libs/${MOD_ID}-fabric-${MC_VERSION}-${MOD_VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "neoforge_jar=neoforge/build/libs/${MOD_ID}-neoforge-${MC_VERSION}-${MOD_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Normalize Fabric game versions
        id: fabric_versions
        run: |
          NORMALIZED=$(echo "${{ steps.metadata.outputs.fabric_game_versions }}" \
            | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          if [ -z "$NORMALIZED" ]; then
            echo "No valid Fabric versions found."
            exit 1
          fi
          echo "list<<EOF_LIST" >> "$GITHUB_OUTPUT"
          echo "$NORMALIZED" >> "$GITHUB_OUTPUT"
          echo "EOF_LIST" >> "$GITHUB_OUTPUT"

      - name: Normalize NeoForge game versions
        id: neoforge_versions
        run: |
          NORMALIZED=$(echo "${{ steps.metadata.outputs.neoforge_game_versions }}" \
            | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          if [ -z "$NORMALIZED" ]; then
            echo "No valid NeoForge versions found."
            exit 1
          fi
          echo "list<<EOF_LIST" >> "$GITHUB_OUTPUT"
          echo "$NORMALIZED" >> "$GITHUB_OUTPUT"
          echo "EOF_LIST" >> "$GITHUB_OUTPUT"

      - name: Compute Fabric supported range label
        id: fabric_range
        run: |
          FIRST=$(echo "${{ steps.fabric_versions.outputs.list }}" | head -n1)
          LAST=$(echo "${{ steps.fabric_versions.outputs.list }}" | tail -n1)
          LABEL=$([ "$FIRST" = "$LAST" ] && echo "$FIRST" || echo "$FIRST-$LAST")
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Compute NeoForge supported range label
        id: neoforge_range
        run: |
          FIRST=$(echo "${{ steps.neoforge_versions.outputs.list }}" | head -n1)
          LAST=$(echo "${{ steps.neoforge_versions.outputs.list }}" | tail -n1)
          LABEL=$([ "$FIRST" = "$LAST" ] && echo "$FIRST" || echo "$FIRST-$LAST")
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Tag must match vX.Y.Z. Got: ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "${{ steps.metadata.outputs.mod_version }}" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match mod_version (${{ steps.metadata.outputs.mod_version }})."
            exit 1
          fi

      - name: Build all loaders and versions
        run: |
          if [ -f "./scripts/build-all-versions.sh" ]; then
            chmod +x ./scripts/build-all-versions.sh
            ./scripts/build-all-versions.sh
          else
            ./gradlew --no-daemon --stacktrace clean buildAll strictCheck
          fi

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          VERSION="${CURRENT#v}"
          CHANGELOG_SECTION="$(mktemp)"

          awk -v heading="## ${VERSION}" '
            $0 == heading { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' CHANGELOG.md > "$CHANGELOG_SECTION"

          if [ -s "$CHANGELOG_SECTION" ]; then
            NOTES_SOURCE="$CHANGELOG_SECTION"
          else
            PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${CURRENT}$" | head -n1 || true)
            NOTES_SOURCE="$(mktemp)"

            {
              if [ -n "$PREV" ]; then
                echo "### Changes since ${PREV}"
                git log --pretty='- %s (%h)' "${PREV}..${CURRENT}"
              else
                echo "### Changes"
                git log --pretty='- %s (%h)' "${CURRENT}"
              fi
            } > "$NOTES_SOURCE"
          fi

          {
            echo "## Jump Delay Fix ${CURRENT}"
            echo
            echo "- Mod version: ${{ steps.metadata.outputs.mod_version }}"
            echo "- Minecraft versions: 1.21.9, 1.21.10, 1.21.11"
            echo "- Fabric versions: 1.21.9, 1.21.10, 1.21.11"
            echo "- NeoForge versions: 1.21.9, 1.21.10, 1.21.11"
            echo
            cat "$NOTES_SOURCE"
          } > release-notes.md

      - name: Generate checksums
        run: |
          if [ -d "release-artifacts" ]; then
            echo "Checksums already generated in release-artifacts/SHA256SUMS.txt"
          else
            sha256sum "${{ steps.artifacts.outputs.fabric_jar }}" > fabric/build/libs/FABRIC-SHA256SUMS.txt
            sha256sum "${{ steps.artifacts.outputs.neoforge_jar }}" > neoforge/build/libs/NEOFORGE-SHA256SUMS.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jumpdelayfix-release-artifacts
          path: |
            release-artifacts/*.jar
            release-artifacts/SHA256SUMS.txt
            ${{ steps.artifacts.outputs.fabric_jar }}
            ${{ steps.artifacts.outputs.neoforge_jar }}
          if-no-files-found: warn

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Jump Delay Fix v${{ steps.metadata.outputs.mod_version }} (Minecraft 1.21.9 - 1.21.11)
          body_path: release-notes.md
          files: |
            release-artifacts/*.jar
            release-artifacts/SHA256SUMS.txt

      - name: Check publishing credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          [ -n "${MODRINTH_TOKEN:-}" ] && echo "Modrinth token is configured." || echo "Modrinth token is not configured (will be skipped)."
          [ -n "${CURSEFORGE_TOKEN:-}" ] && echo "CurseForge token is configured." || echo "CurseForge token is not configured (will be skipped)."

      - name: Publish to Modrinth & CurseForge - Minecraft 1.21.9
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Jump Delay Fix ${{ steps.metadata.outputs.mod_version }} (Minecraft 1.21.9)
          version: ${{ steps.metadata.outputs.mod_version }}-1.21.9
          version-type: release
          game-versions: 1.21.9
          loaders: |
            fabric
            neoforge
          java: ${{ steps.metadata.outputs.java_version }}
          environment: client
          files: |
            release-artifacts/jumpdelayfix-fabric-1.21.9-${{ steps.metadata.outputs.mod_version }}.jar
            release-artifacts/jumpdelayfix-neoforge-1.21.9-${{ steps.metadata.outputs.mod_version }}.jar
          changelog-file: release-notes.md

      - name: Publish to Modrinth & CurseForge - Minecraft 1.21.10
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Jump Delay Fix ${{ steps.metadata.outputs.mod_version }} (Minecraft 1.21.10)
          version: ${{ steps.metadata.outputs.mod_version }}-1.21.10
          version-type: release
          game-versions: 1.21.10
          loaders: |
            fabric
            neoforge
          java: ${{ steps.metadata.outputs.java_version }}
          environment: client
          files: |
            release-artifacts/jumpdelayfix-fabric-1.21.10-${{ steps.metadata.outputs.mod_version }}.jar
            release-artifacts/jumpdelayfix-neoforge-1.21.10-${{ steps.metadata.outputs.mod_version }}.jar
          changelog-file: release-notes.md

      - name: Publish to Modrinth & CurseForge - Minecraft 1.21.11
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Jump Delay Fix ${{ steps.metadata.outputs.mod_version }} (Minecraft 1.21.11)
          version: ${{ steps.metadata.outputs.mod_version }}-1.21.11
          version-type: release
          game-versions: 1.21.11
          loaders: |
            fabric
            neoforge
          java: ${{ steps.metadata.outputs.java_version }}
          environment: client
          files: |
            release-artifacts/jumpdelayfix-fabric-1.21.11-${{ steps.metadata.outputs.mod_version }}.jar
            release-artifacts/jumpdelayfix-neoforge-1.21.11-${{ steps.metadata.outputs.mod_version }}.jar
          changelog-file: release-notes.md
