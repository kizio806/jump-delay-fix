name: "SonarCloud Analysis"

on:
  push:
    branches:
      - main
      - 'support/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'support/**'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Java version
        id: jvm
        run: |
          JVM_VER=$(grep '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=${JVM_VER:-25}" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.0.0

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jvm.outputs.version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.0.0

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Run Tests, JaCoCo and SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            ./gradlew --no-daemon clean test jacocoTestReport sonar
          else
            echo "SONAR_TOKEN is not configured. Running tests and JaCoCo coverage reports without SonarCloud upload."
            ./gradlew --no-daemon clean test jacocoTestReport
          fi
