name: CI

on:
  pull_request:
    branches: [ main, 'release/**' ]
  push:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint & Structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Structure, hygiene and semver validation
        run: ./gradlew --no-daemon validateStructure validateSourceHygiene verifySemverVersion verifyMinecraftVersionMatrix

  test-common:
    name: Unit Tests (Common)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Run common tests
        run: ./gradlew --no-daemon :common:test :common:jacocoTestReport :common:jacocoTestCoverageVerification

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-common
          path: common/build/reports/jacoco/
          if-no-files-found: ignore

  test-fabric:
    name: Build & Test (Fabric)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Build and test Fabric
        run: ./gradlew --no-daemon :fabric:build :fabric:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-fabric
          path: |
            fabric/build/reports/tests/**
            fabric/build/test-results/**
          if-no-files-found: ignore

      - name: Upload Fabric JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: fabric/build/libs/*.jar
          if-no-files-found: error

  test-neoforge:
    name: Build & Test (NeoForge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Build and test NeoForge
        run: ./gradlew --no-daemon :neoforge:build :neoforge:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-neoforge
          path: |
            neoforge/build/reports/tests/**
            neoforge/build/test-results/**
          if-no-files-found: ignore

      - name: Upload NeoForge JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

  verify:
    name: Verify Release Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [ test-common, test-fabric, test-neoforge ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Full strict check
        run: ./gradlew --no-daemon publishReadyCheck strictCheck
