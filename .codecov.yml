coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 0%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false

component_management:
  individual_components:
    - component_id: common
      name: Common Core
      paths:
        - common/**
    - component_id: fabric
      name: Fabric Loader
      paths:
        - fabric/**
    - component_id: neoforge
      name: NeoForge Loader
      paths:
        - neoforge/**
