plugins {
    id 'net.neoforged.moddev' version "${neoforge_moddev_gradle_version}"
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

sourceSets {
    main {
        java.srcDirs += project(':common').sourceSets.main.java.srcDirs
        resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs
    }
}

neoForge {
    version = "${neoforge_version}"

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    runs {
        gameTestServer {
            server()
            ideName = 'NeoForge GameTest Server'
            gameDirectory = layout.buildDirectory.dir('gametest-server')
            sourceSet = sourceSets.test
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def metadataProperties = [
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_version         : project.version,
        mod_description     : mod_description,
        mod_author          : mod_author,
        mod_license         : mod_license,
        mod_icon            : mod_icon,
        mod_homepage        : mod_homepage,
        mod_sources         : mod_sources,
        mod_issues          : mod_issues,
        minecraft_version_range: minecraft_version_range,
        javafml_loader_range : javafml_loader_range,
        neoforge_loader_range : neoforge_loader_range,
        data_pack_format   : data_pack_format,
        resource_pack_format: resource_pack_format
]

def commonIconFile = project(':common').layout.projectDirectory.file("src/main/resources/${mod_icon}").asFile
def productionModsTomlFile = layout.projectDirectory.file('src/main/resources/META-INF/neoforge.mods.toml').asFile

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties(metadataProperties)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(metadataProperties)
    }

    filesMatching('pack.mcmeta') {
        expand(metadataProperties)
    }
}

tasks.register('validateProductionMetadata') {
    group = 'verification'
    description = 'Validates NeoForge production metadata and icon dimensions.'
    dependsOn tasks.processResources

    doLast {
        if (!commonIconFile.exists()) {
            throw new GradleException("Missing icon file: ${commonIconFile}")
        }

        def image = javax.imageio.ImageIO.read(commonIconFile)
        if (image == null) {
            throw new GradleException("Icon is not a valid image: ${commonIconFile}")
        }
        if (image.width != 512 || image.height != 512) {
            throw new GradleException("Icon must be exactly 512x512, got ${image.width}x${image.height}")
        }

        if (!productionModsTomlFile.exists()) {
            throw new GradleException("Missing neoforge.mods.toml in ${productionModsTomlFile.parentFile}")
        }
    }
}

tasks.register('verifyDedicatedServerSafe') {
    group = 'verification'
    description = 'Checks that non-client NeoForge classes do not hard-reference client-only packages.'
    dependsOn tasks.classes

    doLast {
        def disallowedPackages = [
                'net/minecraft/client',
                'net/neoforged/neoforge/client',
                'com/terraformersmc/modmenu',
                'net/fabricmc/fabric/api/client'
        ]
        def offenders = new LinkedHashSet<String>()

        sourceSets.main.output.classesDirs.files.each { classesDir ->
            if (!classesDir.exists()) {
                return
            }

            fileTree(classesDir).matching {
                include 'com/kizio/jumpdelayfix/**/*.class'
            }.files.each { classFile ->
                def relativePath = classesDir.toPath().relativize(classFile.toPath()).toString().replace(File.separator, '/')
                if (relativePath.contains('/client/')) {
                    return
                }

                def bytecodeAsText = new String(classFile.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                disallowedPackages.each { disallowed ->
                    if (bytecodeAsText.contains(disallowed)) {
                        offenders.add("${relativePath} -> ${disallowed}")
                    }
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Dedicated server safety check failed. Non-client classes reference client-only packages:\n - " +
                            offenders.join('\n - ')
            )
        }
    }
}

tasks.register('headlessGameTest') {
    group = 'verification'
    description = 'Runs NeoForge GameTest server headlessly.'
    dependsOn(tasks.named('runGameTestServer'))
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

tasks.named('check') {
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('printFMLEnvironment') {
    doLast {
        sourceSets.main.compileClasspath.each { file ->
            if (file.name.endsWith(".jar")) {
                new java.util.zip.ZipFile(file).entries().findAll { it.name.contains("GameTest") && it.name.endsWith(".class") }.each { println it.name }
            }
        }
    }
}
